#@TYPE: Machine
#@NAME: Radxa ROCK 5C (RK3588S)
#@DESCRIPTION: Machine configuration for the Radxa ROCK 5C, mainline
#  kernel/U-Boot via the community meta-rockchip layer.
#
# NOT VERIFIED ON REAL HARDWARE, build-tested (see ../README.md "First
# build checklist"): rock-5c has no dedicated upstream U-Boot defconfig or
# board file yet (only rock-5a/rock-5b do, both also RK3588S/RK3588). This
# machine boots via rock-5a's defconfig (closest match: same RK3588S SoC
# variant) with only its default devicetree overridden to rock-5c's own -
# see recipes-bsp/u-boot/files/rock-5c-fdt.cfg. A real board-specific
# U-Boot port (pinmux, regulators, ...) may still be needed; this got a
# real `bitbake udg-image` from erroring on a missing defconfig to a
# successful U-Boot compile, nothing more.

require conf/machine/include/rk3588s.inc

KERNEL_DEVICETREE = "rockchip/rk3588s-rock-5c.dtb"

UBOOT_MACHINE = "rock5a-rk3588s_defconfig"

# The ROCK 5C ships an onboard eMMC-friendly form factor and is the target
# storage medium for this product (see ../README.md). U-Boot boots from
# whichever media it was itself flashed to.
MACHINE_FEATURES:append = " emmc"

# Mali-G610 (Valhall) via the mainline Panthor kernel driver + Mesa
# panfrost/panthor Gallium driver. GLES3.1 only -> Godot must run with the
# "Compatibility" (GLES3) rendering method, not the Forward+/Vulkan one.
MESA_GPU_DRIVERS ?= "panfrost"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"

# Serial debug console (UART2, matches other Radxa RK3588 boards)
SERIAL_CONSOLES ?= "1500000;ttyS2"
