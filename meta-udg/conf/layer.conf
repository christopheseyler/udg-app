# meta-udg: application/product layer for "Ultimate Darts Game" on the
# Radxa ROCK 5C (RK3588S), with RAUC A/B updates.
#
# This layer intentionally does NOT depend on radxa/meta-rockchip (the
# vendor SDK layer) or on rauc/meta-rauc-community. It targets the
# upstream/community meta-rockchip layer (git.yoctoproject.org/meta-rockchip,
# mainline kernel + mainline U-Boot + Mesa panfrost/panthor) and reimplements
# the small amount of RAUC/Rockchip glue itself, scoped to the rock-5c
# machine only, so there is exactly one place that owns the boot flow.
# See ../README.md for the full layer list, branches and build steps.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "udg"
BBFILE_PATTERN_udg = "^${LAYERDIR}/"
BBFILE_PRIORITY_udg = "10"

LAYERSERIES_COMPAT_udg = "scarthgap"

LAYERDEPENDS_udg = "core rockchip rauc"

LAYERDIR_UDG = "${LAYERDIR}"
