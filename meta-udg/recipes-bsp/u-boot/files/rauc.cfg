# U-Boot Kconfig fragment (merged via merge_config.sh by OE-core's
# u-boot.inc when listed in SRC_URI as a .cfg file) instead of a positional
# patch against rk3588_defconfig, whose exact contents we have not verified.
#
# Purpose: source and run boot.scr (compiled from ../files/boot.cmd) instead
# of U-Boot's stock distro_bootcmd, and persist the U-Boot environment (so
# BOOT_A_LEFT/BOOT_B_LEFT/raucslot survive a reboot) in the "uboot_env"
# partition defined in ../../../wic/rock5c-rauc.wks.in (offset 8128 sectors
# = 0x3F8000 bytes, size 64 sectors = 0x8000 bytes, on mmc device 1 = eMMC).
#
# UNVERIFIED: confirm after first `bitbake virtual/bootloader` that these
# don't conflict with what rk3588_defconfig already sets (see
# ../../../README.md "First build checklist").

CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SYSBOOT=y
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_MMC_ENV_DEV=1
CONFIG_ENV_OFFSET=0x3F8000
CONFIG_ENV_SIZE=0x8000
CONFIG_BOOTCOMMAND="load mmc 1:9 $loadaddr boot.scr; source $loadaddr"
