# rock5a-rk3588s_defconfig (used as UBOOT_MACHINE for rock-5c - see
# ../../../conf/machine/rock-5c.conf, no dedicated rock-5c defconfig
# exists upstream yet) defaults to rock-5a's own devicetree
# (CONFIG_DEFAULT_FDT_FILE="rockchip/rk3588s-rock-5a.dtb"). Override it to
# rock-5c's, matching KERNEL_DEVICETREE in the machine conf, otherwise
# U-Boot would hand the kernel the wrong board's DT.
CONFIG_DEFAULT_FDT_FILE="rockchip/rk3588s-rock-5c.dtb"
