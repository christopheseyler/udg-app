# Weston kiosk-shell config: whatever Wayland client connects first (our
# game, launched by udg-game.service, see ../files/udg-game.service) is
# made fullscreen automatically - no window manager, no desktop, no idle
# blanking.
[core]
shell=kiosk-shell.so
xwayland=false
idle-time=0

[output]
name=*
mode=preferred
